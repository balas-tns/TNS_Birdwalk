<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1F5C43">
<meta name="description" content="Tirupati Nature Society bird sound walks, powered by BirdNET+ V3.0">
<title>TNS Bird Walk</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Noto+Sans+Telugu:wght@700&display=swap">
<style>
:root{--green:#1F5C43;--green2:#143D2C;--mint:#E3EEE7;--bg:#F3F5EF;--ink:#17251E;--muted:#55635B;--ochre:#8A5200;--ochreBg:#FCEFD8;--red:#B3261E;--card:#fff;--line:#E6EBE6}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.5 Manrope,system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
#app{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding-bottom:calc(84px + env(safe-area-inset-bottom))}
header{padding:calc(18px + env(safe-area-inset-top)) 20px 8px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand b{display:block;font-family:'Noto Sans Telugu',Manrope,sans-serif;font-size:22px;color:var(--green)}
.brand span{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.04em}
main{flex:1;padding:8px 20px 20px;display:flex;flex-direction:column;gap:14px}
h1{font-size:24px;line-height:1.2;margin:0}
h2{font-size:16px;margin:4px 0 0}
p{margin:0}
.muted{color:var(--muted);font-size:14px}
.card{background:var(--card);border-radius:16px;padding:14px 16px}
.hero{background:var(--green);color:#fff;border-radius:22px;padding:20px;display:flex;flex-direction:column;gap:12px}
.hero .stats{display:flex;gap:22px}
.hero .stats b{display:block;font-size:22px}
.hero .stats span{font-size:13px;opacity:.85}
.route{all:unset;box-sizing:border-box;cursor:pointer;background:#fff;border-radius:16px;padding:14px 16px;display:flex;align-items:center;gap:14px;border:2px solid #fff;width:100%}
.route[aria-pressed=true]{border-color:var(--green)}
.route .ic{width:44px;height:44px;border-radius:12px;background:var(--mint);display:grid;place-items:center;flex:none}
.route b{display:block;font-size:15px}
.tag{font-size:12px;font-weight:700;color:var(--ochre);background:var(--ochreBg);padding:4px 8px;border-radius:8px;white-space:nowrap}
.btn{all:unset;box-sizing:border-box;cursor:pointer;height:56px;border-radius:16px;background:var(--green);color:#fff;font-weight:800;font-size:17px;display:flex;align-items:center;justify-content:center;gap:10px;width:100%;text-align:center}
.btn.alt{background:#fff;color:var(--green);border:2px solid var(--green)}
.btn.small{height:44px;font-size:14px;border-radius:12px}
.btn[disabled]{opacity:.5;pointer-events:none}
.btn:focus-visible,.route:focus-visible,.chip:focus-visible,.navb:focus-visible{outline:3px solid var(--ochre);outline-offset:2px}
.row{display:flex;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat{background:#fff;border-radius:16px;padding:12px}
.stat span{font-size:11px;font-weight:700;color:var(--muted);display:block}
.stat b{font-size:21px;font-variant-numeric:tabular-nums}
.live{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:#fff;background:var(--red);padding:6px 10px;border-radius:999px}
.live.off{background:var(--muted)}
.live i{width:8px;height:8px;border-radius:4px;background:#fff}
.meter{height:34px;display:flex;align-items:flex-end;gap:3px}
.meter span{flex:1;background:var(--green);border-radius:2px;min-height:3px}
.map{background:#DDE8DF;border-radius:20px;height:240px;overflow:hidden;position:relative}
.map svg{width:100%;height:100%;display:block}
.map .note{position:absolute;left:10px;bottom:10px;background:#fff;border-radius:10px;padding:5px 9px;font-size:11px;font-weight:700;color:#33423A}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{all:unset;cursor:pointer;padding:8px 14px;border-radius:999px;font-size:13px;font-weight:700;background:#fff;color:#33423A}
.chip[aria-pressed=true]{background:var(--green);color:#fff}
.sp{background:#fff;border-radius:14px;padding:10px 12px;display:flex;align-items:center;gap:12px}
.play{all:unset;cursor:pointer;width:44px;height:44px;border-radius:22px;background:var(--mint);display:grid;place-items:center;flex:none}
.play[disabled]{opacity:.35;cursor:default}
.sp .nm{flex:1}
.sp .nm b{display:block;font-size:15px}
.sp .nm i{font-size:12px;color:var(--muted)}
.sp .rt{display:flex;flex-direction:column;align-items:flex-end;gap:3px;font-size:11px;color:var(--muted)}
.pill{font-size:11px;font-weight:700;padding:3px 8px;border-radius:8px;background:var(--mint);color:var(--green)}
.pill.rev{background:var(--ochreBg);color:#6B4000}
.banner{background:var(--ochreBg);color:#6B4000;border-radius:14px;padding:10px 14px;font-size:13px;font-weight:700}
.banner.err{background:#FBE4E2;color:#7A1C16}
label.f{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:700}
input,select{font:inherit;font-size:16px;padding:10px 12px;border-radius:12px;border:1px solid #C9D3CC;background:#fff;color:var(--ink)}
input[type=range]{padding:0;accent-color:var(--green)}
.qr{background:#fff;border-radius:16px;padding:16px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.qr svg{width:200px;height:200px}
.qrs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.qrs .qr svg{width:130px;height:130px}
nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom));display:flex;justify-content:center}
nav .in{max-width:560px;width:100%;display:flex;justify-content:space-around}
.navb{all:unset;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:700;color:var(--muted);min-width:64px;padding:6px 0}
.navb[aria-current=page]{color:var(--green)}
.empty{text-align:center;padding:30px 10px;color:var(--muted)}
.prog{height:10px;border-radius:5px;background:var(--mint);overflow:hidden}
.prog i{display:block;height:10px;background:var(--green);border-radius:5px}
.hide{display:none!important}
.sr{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.say{background:var(--ochreBg);color:#6B4000;border:2px solid #6B4000}
.toggle{display:flex;gap:12px;align-items:flex-start;font-size:15px;font-weight:600;cursor:pointer}
.toggle input{width:26px;height:26px;flex:none;accent-color:var(--green);margin:0}
.toggle small{display:block;font-weight:400;font-size:13px;color:var(--muted)}
h1:focus,h1:focus-visible{outline:none}
.play:focus-visible,.toggle input:focus-visible{outline:3px solid var(--ochre);outline-offset:2px}
/* larger text */
body.big{font-size:19px}
body.big h1{font-size:30px}
body.big h2{font-size:20px}
body.big .muted,body.big .card,body.big .route b,body.big .sp .nm b{font-size:18px}
body.big .btn{height:68px;font-size:21px}
body.big .btn.small{height:56px;font-size:17px}
body.big .chip,body.big .pill,body.big .tag,body.big .sp .rt,body.big .stat span,body.big .navb{font-size:15px}
body.big .stat b{font-size:24px;white-space:nowrap}
/* high contrast */
body.hc{--bg:#fff;--ink:#000;--muted:#222;--green:#0B3A26;--mint:#D4E6DA;--line:#000}
body.hc .card,body.hc .route,body.hc .stat,body.hc .sp,body.hc .chip,body.hc .qr{border:2px solid #000}
body.hc .btn.alt{border-width:3px}
@media print{nav,header,.noprint{display:none!important}body{background:#fff}.qrs{grid-template-columns:repeat(2,1fr)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand"><b lang="te">పిట్ట పాట</b><span style="text-transform:uppercase">TNS Bird Walk</span></div>
    <span id="modelBadge" class="tag">Loading model…</span>
  </header>
  <main id="view"></main>
  <div id="sr" class="sr" role="status" aria-live="polite"></div>
  <div id="srA" class="sr" role="alert"></div>
</div>
<nav aria-label="Main">
  <div class="in">
    <button class="navb" data-go="home"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>Home</button>
    <button class="navb" data-go="history"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg>My walks</button>
    <button class="navb" data-go="more"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><path d="M14 14h3v3h-3zM18 18h3v3h-3z"/></svg>Share &amp; settings</button>
  </div>
</nav>
<script src="config.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script src="app.js"></script>
</body>
</html>
