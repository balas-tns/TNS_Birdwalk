<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#154734">
<meta name="description" content="Tirupati Nature Society bird sound walks, powered by BirdNET+ V3.0">
<title>TNS Bird Walk</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;700&family=Ramabhadra&family=Tiro+Telugu&family=Baloo+Tammudu+2:wght@600;800&display=swap">
<style>
/* TNS Bird Walk v17: four styles, chosen in Share & settings (body data-theme).
   forest (default) = Forest and turmeric · kalam = Kalamkari · dawn = Pre-dawn (dark) · field = Field guide.
   Reading text is always Atkinson Hyperlegible Next (made for low-vision readers). */
:root{
  --forest:#154734;--forest2:#0E3324;--paper:#F4F7F2;--sheet:#FFFFFF;--ink:#11261B;--muted:#4F6157;
  --mist:#DCE7DE;--line:#D5DFD7;--turmeric:#F2B705;--turmericBg:#FFF3CC;--turmericInk:#4A3800;--kumkum:#B3261E;
  /* old names kept so nothing else breaks */
  --green:var(--forest);--green2:var(--forest2);--mint:var(--mist);--bg:var(--paper);--card:var(--sheet);
  --ochre:#7A5A00;--ochreBg:var(--turmericBg);--red:var(--kumkum);
  --r-lg:24px;--r-md:14px;--r-sm:10px;
  --onpri:#FFFFFF;--accInk:#11261B;--stop:#B3261E;--stopInk:#FFFFFF;--stopRing:rgba(179,38,30,.18);--ring:rgba(21,71,52,.16);
  --hero:#154734;--heroInk:#FFFFFF;--heroMuted:#CFE3D6;--panel:#0E3324;--panelInk:#FFFFFF;--panelMuted:#BFD6C7;--panelRule:rgba(255,255,255,.18);
  --trace:rgba(255,255,255,.55);--heroTrace:rgba(255,255,255,.32);--mark:#F2B705;--track:#154734;--dot:#F2B705;--dotStroke:#11261B;
  --cardBorder:0 solid transparent;--ph:#5F7067;--focusRing:rgba(21,71,52,.25);--errBg:#FBE4E2;--errInk:#7A1C16;--danger:#B3261E;
  --fontHead:'Atkinson Hyperlegible Next','Atkinson Hyperlegible',system-ui,sans-serif;--fontWord:Ramabhadra,'Noto Sans Telugu',sans-serif;--headW:700;--wordInk:#154734}
body[data-theme=kalam]{--forest:#9C2F2A;--forest2:#7E2420;--paper:#F3EEE4;--sheet:#FBF8F2;--ink:#231F1C;--muted:#5A514A;--mist:#E6DED0;--line:#CFC4B3;
  --turmeric:#23395B;--accInk:#FFFFFF;--turmericBg:#E3E8F1;--turmericInk:#23395B;--stop:#9C2F2A;--stopRing:rgba(156,47,42,.18);--ring:rgba(156,47,42,.16);
  --hero:#23395B;--heroInk:#FFFFFF;--heroMuted:#DDE2EC;--panel:#FBF8F2;--panelInk:#231F1C;--panelMuted:#5A514A;--panelRule:rgba(35,31,28,.3);
  --trace:#231F1C;--heroTrace:rgba(255,255,255,.45);--mark:#9C2F2A;--track:#23395B;--dot:#9C2F2A;--dotStroke:#FBF8F2;
  --cardBorder:1.5px solid #231F1C;--r-lg:6px;--r-md:4px;--r-sm:4px;--ph:#6A6058;--focusRing:rgba(35,57,91,.3);--danger:#9C2F2A;
  --fontHead:'Tiro Telugu',serif;--fontWord:'Tiro Telugu',serif;--wordInk:#9C2F2A}
body[data-theme=dawn]{--forest:#FE9F6D;--forest2:#E8865A;--onpri:#1A0F0A;--paper:#0D1620;--sheet:#16222E;--ink:#EAF1F5;--muted:#A7B8C6;--mist:#22313F;--line:#2E4052;
  --turmeric:#FCFDBF;--accInk:#1A0F0A;--turmericBg:#3A3320;--turmericInk:#FCE9A6;--stop:#FF7A7A;--stopInk:#1A0F0A;--stopRing:rgba(255,122,122,.2);--ring:rgba(254,159,109,.18);
  --hero:#16222E;--heroInk:#EAF1F5;--heroMuted:#A7B8C6;--panel:#101C27;--panelInk:#EAF1F5;--panelMuted:#A7B8C6;--panelRule:rgba(255,255,255,.14);
  --mark:#FCFDBF;--track:#FE9F6D;--dot:#FCFDBF;--dotStroke:#0D1620;--ph:#8B9DAC;--focusRing:rgba(252,253,191,.35);--errBg:#3B1A1A;--errInk:#FFB4AB;--danger:#FF8A80;--wordInk:#EAF1F5}
body[data-theme=field]{--forest:#1565C0;--forest2:#0D47A1;--paper:#FFFFFF;--sheet:#F2F5F8;--ink:#1B1F24;--muted:#555E68;--mist:#E3ECF7;--line:#E1E6EB;
  --turmeric:#E08A00;--accInk:#1B1F24;--turmericBg:#FFF1DB;--turmericInk:#6B4300;--stop:#C62828;--stopRing:rgba(198,40,40,.16);--ring:rgba(21,101,192,.16);
  --hero:#1565C0;--heroInk:#FFFFFF;--heroMuted:#D6E6FA;--panel:#F2F5F8;--panelInk:#1B1F24;--panelMuted:#555E68;--panelRule:#D5DCE3;
  --trace:#1565C0;--heroTrace:rgba(255,255,255,.4);--mark:#E08A00;--track:#1565C0;--dot:#E08A00;--dotStroke:#1B1F24;
  --r-lg:28px;--r-md:20px;--r-sm:14px;--ph:#5E6770;--focusRing:rgba(21,101,192,.3);--danger:#C62828;
  --fontHead:'Baloo Tammudu 2',system-ui,sans-serif;--fontWord:'Baloo Tammudu 2',system-ui,sans-serif;--headW:800;--wordInk:#1565C0}
body[data-theme=kalam] .hero{position:relative}
body[data-theme=kalam] .hero::after{content:'';position:absolute;inset:6px;border:1px solid rgba(255,255,255,.55);border-radius:3px;pointer-events:none}
.gdot{display:none}
body[data-theme=field] .gdot{display:inline-block;width:12px;height:12px;border-radius:6px;background:var(--g);flex:none;margin-right:8px;vertical-align:middle}
*{box-sizing:border-box;min-width:0}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{margin:0;height:100%;overflow:hidden}
body{display:flex;flex-direction:column;height:100dvh;background:var(--paper);color:var(--ink);font:15px/1.4 'Atkinson Hyperlegible Next','Atkinson Hyperlegible',system-ui,sans-serif;-webkit-tap-highlight-color:transparent;font-variant-numeric:tabular-nums}
#app{flex:1;min-height:0;width:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column}
header{flex:none;padding:calc(10px + env(safe-area-inset-top)) 16px 4px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;row-gap:0}
.brand b{font-family:var(--fontWord);font-weight:400;font-size:26px;line-height:1.1;color:var(--wordInk);white-space:nowrap}
body[data-theme=field] .brand b{font-weight:800;font-size:28px}
.brand span{font-size:14px;color:var(--muted);white-space:nowrap}
header .tag{flex:none}
main{flex:1;min-height:0;overflow-y:auto;padding:8px 18px 12px;display:flex;flex-direction:column;gap:12px}
main.fit{gap:10px}
h1{font-family:var(--fontHead);font-weight:var(--headW);font-size:21px;line-height:1.15;margin:0;letter-spacing:-.01em}
h2{font-size:16px;line-height:1.25;margin:4px 0 -4px}
p{margin:0}
.muted{color:var(--muted);font-size:13px}
.card{background:var(--sheet);border-radius:var(--r-md);padding:16px;border:var(--cardBorder)}
/* home hero */
.hero{flex:none;background:var(--hero);color:var(--heroInk);border:var(--cardBorder);border-radius:var(--r-lg);padding:12px 16px 0;display:flex;flex-direction:column;gap:3px;overflow:hidden}
.hero .hi{font-size:13px;color:var(--heroMuted)}
.hero h1{font-size:21px}
.hero .sum{font-size:13px;color:var(--heroMuted);margin-top:2px}
.hero .trace{display:block;width:calc(100% + 32px);margin:6px -16px 0;height:34px}
.hero .stats{display:flex;gap:22px}
.hero .stats b{display:block;font-size:22px}
.hero .stats span{font-size:13px}
/* fields */
.fields{flex:none;display:flex;flex-direction:column;gap:10px}
label.f{display:flex;flex-direction:column;gap:3px;font-size:13px;font-weight:700}
input,select{font:inherit;font-size:16px;min-height:44px;padding:6px 12px;border-radius:var(--r-sm);border:2px solid var(--line);background:var(--sheet);color:var(--ink)}
input:focus,select:focus{outline:none;border-color:var(--forest);box-shadow:0 0 0 3px var(--focusRing)}
input::placeholder{color:var(--ph)}
input[type=range]{padding:0;min-height:0;border:0;accent-color:var(--forest)}
.tip{flex:none;font-size:13px;color:var(--muted);padding-left:14px;border-left:3px solid var(--turmeric)}
.linkish.danger{color:var(--danger)}
.linkish{all:unset;cursor:pointer;font-weight:700;color:var(--forest);text-decoration:underline;text-underline-offset:3px;padding:6px 0;align-self:flex-start}
/* grouped settings */
.group{background:var(--sheet);border-radius:var(--r-md);display:flex;flex-direction:column;border:var(--cardBorder)}
.group>*{padding:14px 16px}
.group>*+*{border-top:1px solid var(--line)}
.group .btn{margin:14px 16px;width:auto}
.group a{color:var(--forest)}
/* routes and history rows */
.route{all:unset;box-sizing:border-box;cursor:pointer;background:var(--sheet);border-radius:var(--r-md);padding:14px 16px;display:flex;align-items:center;gap:14px;border:2px solid transparent;width:100%}
.route[aria-pressed=true]{border-color:var(--forest)}
.route .ic{width:44px;height:44px;border-radius:12px;background:var(--mist);display:grid;place-items:center;flex:none}
.route b{display:block;font-size:17px}
.tag{font-size:13px;font-weight:700;color:var(--turmericInk);background:var(--turmericBg);padding:4px 10px;border-radius:999px;white-space:nowrap}
.list{background:var(--sheet);border-radius:var(--r-md);overflow:hidden;border:var(--cardBorder)}
.list>*+*{border-top:1px solid var(--line)}
.list .route{border-radius:0;border:0}
/* buttons */
.btn{all:unset;box-sizing:border-box;cursor:pointer;min-height:52px;padding:0 16px;border-radius:var(--r-md);background:var(--forest);font-weight:700;font-size:17px;display:flex;align-items:center;justify-content:center;gap:10px;width:100%;text-align:center;color:var(--onpri)}
.btn:active{background:var(--forest2)}
.btn.alt{background:transparent;color:var(--forest);border:2px solid var(--forest)}
.btn.small{min-height:44px;font-size:15px;border-radius:var(--r-sm)}
.btn[disabled]{opacity:.45;pointer-events:none}
.say{background:var(--turmeric);color:var(--accInk);border:0}
.btn.say:active{filter:brightness(.92)}
.micbtn:focus-visible,.rbtn:focus-visible,.btn:focus-visible,.route:focus-visible,.chip:focus-visible,.navb:focus-visible,.play:focus-visible,.linkish:focus-visible,.toggle input:focus-visible{outline:3px solid var(--forest);outline-offset:3px}
/* microphone and round walk controls */
.mic{flex:1 0 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px}
.micbtn{all:unset;box-sizing:border-box;cursor:pointer;flex:none;aspect-ratio:1/1;width:92px;height:92px;border-radius:50%;background:var(--forest);color:var(--onpri);display:grid;place-items:center;box-shadow:0 0 0 10px var(--ring);border:var(--cardBorder)}
.micbtn:active{background:var(--forest2)}
.micbtn[disabled]{opacity:.45;pointer-events:none}
.miclbl{margin:0;font-weight:700;font-size:14px;text-align:center}
.ctrls{flex:none;display:flex;justify-content:center;align-items:flex-start;gap:24px;padding:10px 0 2px}
.rb{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:14px;font-weight:700;min-width:76px;text-align:center}
.rbtn{all:unset;box-sizing:border-box;cursor:pointer;width:58px;height:58px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--line);color:var(--ink);background:var(--sheet)}
.rbtn.say{border:0;background:var(--turmeric);color:var(--accInk)}
.rbtn.stop{width:78px;height:78px;border:0;background:var(--stop);color:var(--stopInk);box-shadow:0 0 0 10px var(--stopRing)}
.rbtn.stop.armed{box-shadow:0 0 0 10px var(--stop)}
body.big .micbtn{width:120px;height:120px}
body.big .rbtn{width:76px;height:76px}
body.big .rbtn.stop{width:104px;height:104px}
body.big .rb,body.big .miclbl{font-size:18px}
.row{display:flex;gap:10px}
/* walk screen */
.walkhead{flex:none;display:flex;justify-content:space-between;align-items:center;gap:10px}
.walkhead>div:first-child{flex:1;min-width:0}
.walkhead h1{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wh-r{display:flex;align-items:center;gap:8px;flex:none}
.walkhead .sub{font-size:12px;color:var(--muted);margin:2px 0 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.walkhead h1{font-size:20px}
.live{display:inline-flex;align-items:center;gap:7px;font-size:14px;font-weight:700;color:var(--accInk);background:var(--turmeric);padding:6px 12px;border-radius:999px;white-space:nowrap}
.live.off{background:var(--mist);color:var(--muted)}
.live i{width:10px;height:10px;border-radius:5px;background:var(--ink)}
.live:not(.off) i{animation:beat 1.6s ease-in-out infinite}
@keyframes beat{50%{opacity:.25}}
.panel{flex:none;background:var(--panel);color:var(--panelInk);border:var(--cardBorder);border-radius:var(--r-lg);padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.panel .lbl{display:flex;justify-content:space-between;gap:12px;font-size:13px;color:var(--panelMuted)}
.panel .lbl span{white-space:nowrap}
.meter{display:block;width:100%;height:60px}
.meter svg{display:block;width:100%;height:100%}
.nums{display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
.nums div{padding-left:12px;border-left:1px solid var(--panelRule)}
.nums div:first-child{padding-left:0;border-left:0}
.nums b{display:block;font-size:clamp(20px,5.8vw,24px);line-height:1.1;white-space:nowrap}
.nums span{font-size:13px;color:var(--panelMuted)}
.nums b{font-family:var(--fontHead)}
.heard{display:flex;flex-direction:column}
.heard p{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:15px}
.heard p:first-child{border-top:0}
.heard p span{color:var(--muted);white-space:nowrap}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat{background:var(--sheet);border-radius:var(--r-md);padding:12px}
.stat span{font-size:13px;color:var(--muted);display:block}
.stat b{font-size:22px}
/* maps */
.map{background:var(--mist);border-radius:var(--r-md);height:200px;overflow:hidden;position:relative}
.map svg{width:100%;height:100%;display:block}
.map .note{position:absolute;left:10px;bottom:10px;background:var(--sheet);border-radius:8px;padding:4px 9px;font-size:13px;color:var(--muted)}
/* results */
.meta{font-size:16px;color:var(--muted)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{all:unset;cursor:pointer;padding:9px 16px;border-radius:999px;font-size:15px;font-weight:700;background:var(--sheet);color:var(--ink);border:2px solid var(--line)}
.chip[aria-pressed=true]{background:var(--forest);border-color:var(--forest);color:var(--onpri)}
.splist{background:var(--sheet);border-radius:var(--r-md);overflow:hidden;border:var(--cardBorder)}
.sp{padding:12px 14px;display:flex;align-items:center;gap:12px}
.splist .sp+.sp{border-top:1px solid var(--line)}
.play{all:unset;cursor:pointer;width:46px;height:46px;border-radius:23px;background:var(--forest);display:grid;place-items:center;flex:none}
.play svg{fill:var(--onpri)}
.play[disabled]{background:var(--mist);cursor:default}
.play[disabled] svg{fill:var(--muted)}
.sp .nm{flex:1}
.sp .nm b{display:block;font-size:17px}
.sp .nm i{font-size:14px;color:var(--muted)}
.sp .rt{display:flex;flex-direction:column;align-items:flex-end;gap:3px;font-size:13px;color:var(--muted);text-align:right}
.pill{font-size:14px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--mist);color:var(--forest)}
.pill.rev{background:var(--turmericBg);color:var(--turmericInk)}
.banner{background:var(--turmericBg);color:var(--turmericInk);border-radius:var(--r-md);padding:12px 16px;font-size:15px;font-weight:700}
.banner.err{background:var(--errBg);color:var(--errInk)}
.recover{background:var(--sheet);border-radius:var(--r-lg);padding:18px;display:flex;flex-direction:column;gap:12px;border:3px solid var(--turmeric)}
.recover b{font-size:19px}
.qr{background:var(--sheet);border-radius:var(--r-md);padding:16px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.qr svg{width:200px;height:200px}
.qrs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.qrs .qr svg{width:130px;height:130px}
nav{flex:none;background:var(--sheet);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom));display:flex;justify-content:center}
nav .in{max-width:560px;width:100%;display:flex;justify-content:space-around}
.navb{all:unset;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:13px;color:var(--muted);min-width:96px;padding:6px 4px;border-radius:10px}
.navb[aria-current=page]{color:var(--forest);font-weight:700}
.navb[aria-current=page] svg{stroke-width:2.6}
.empty{text-align:center;padding:30px 10px;color:var(--muted)}
.prog{height:10px;border-radius:5px;background:var(--panelRule);overflow:hidden}
.prog i{display:block;height:10px;background:var(--turmeric);border-radius:5px}
.hide{display:none!important}
/* header icons */
.brand b{font-size:22px}
.hdr-icons{display:flex;align-items:center;gap:6px;flex:none}
.iconbtn{all:unset;box-sizing:border-box;cursor:pointer;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--forest);background:var(--sheet);border:var(--cardBorder)}
.iconbtn[aria-current=page]{background:var(--forest);color:var(--onpri)}
.iconbtn:focus-visible,.tab:focus-visible,.vcbtn:focus-visible,.seg button:focus-visible{outline:3px solid var(--forest);outline-offset:3px}
/* walk tabs */
.tabs{flex:none;display:flex;gap:6px;background:var(--sheet);border-radius:999px;padding:4px;border:var(--cardBorder)}
.tab{all:unset;box-sizing:border-box;cursor:pointer;flex:1;text-align:center;padding:8px 10px;border-radius:999px;font-weight:700;font-size:15px;color:var(--muted)}
.tab[aria-selected=true]{background:var(--forest);color:var(--onpri)}
.pane{flex:1;min-height:90px;display:flex;flex-direction:column}
.pane .heard{flex:1;overflow:hidden;padding:4px 14px}
.pane .map{flex:1;height:auto;min-height:90px}
/* voice command button */
.vcbtn{all:unset;box-sizing:border-box;cursor:pointer;flex:none;align-self:center;display:inline-flex;align-items:center;gap:8px;padding:7px 14px;border-radius:999px;font-weight:700;font-size:13px;color:var(--forest);background:var(--sheet);border:2px solid var(--line)}
.vcbtn.round{width:44px;height:44px;padding:0;justify-content:center}
.vcbtn.on{background:var(--turmeric);color:var(--accInk);border-color:var(--turmeric)}
/* QR pop-up */
dialog{border:0;border-radius:var(--r-lg);padding:0;max-width:min(92vw,420px);width:100%;background:var(--sheet);color:var(--ink)}
dialog::backdrop{background:rgba(0,0,0,.55)}
.qrbox{padding:20px;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
#qrBig svg{width:min(72vw,300px);height:min(72vw,300px);display:block;background:#fff;padding:10px;border-radius:12px}
.seg{display:flex;gap:4px;background:var(--paper);border-radius:999px;padding:4px}
.seg button{all:unset;cursor:pointer;padding:7px 14px;border-radius:999px;font-weight:700;font-size:14px;color:var(--muted)}
.seg button[aria-pressed=true]{background:var(--forest);color:var(--onpri)}
/* profile */
.profile{display:flex;align-items:center;gap:14px}
.avatar{width:56px;height:56px;border-radius:50%;background:var(--forest);color:var(--onpri);display:grid;place-items:center;font-size:24px;font-weight:700;flex:none}
/* compact name boxes (Home and results) */
.fields2{flex:none;display:grid;grid-template-columns:1.25fr 1fr;gap:8px}
.fields input,.fields2 input{min-height:38px;padding:4px 10px;font-size:16px;border-width:1.5px}
.fields label.f,.fields2 label.f{font-size:12px;gap:2px}
/* results: fits the screen; only the species list scrolls inside its own box */
.reshead{flex:none;display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.reshead h1{font-size:20px}
.reshead .muted{margin:2px 0 0}
main.fit .pane .splist{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain}
#rpaneSp{gap:8px}
#rpaneSp .chips{flex:none;flex-wrap:nowrap;overflow-x:auto;padding-bottom:2px}
#rpaneSp .chip{padding:6px 12px;font-size:13px;white-space:nowrap}
#rpaneSp .sp{padding:8px 12px;gap:10px}
#rpaneSp .play{width:38px;height:38px}
#rpaneSp .sp .nm b{font-size:15px}
#rpaneSp .sp .nm i{font-size:12px}
#rpaneMap .map{flex:1;height:auto;min-height:120px}
.resfoot{flex:none;display:flex;flex-direction:column;gap:8px}
.resfoot .btn{min-height:46px}
.banner.small{padding:8px 12px;font-size:13px;margin:0}
details.more summary{cursor:pointer;font-size:13px;color:var(--muted);text-decoration:underline;padding:4px 0;list-style:none;text-align:center}
details.more summary::-webkit-details-marker{display:none}
details.more[open]{display:flex;flex-direction:column;gap:8px}
@media print{html,body{height:auto;overflow:visible}main{overflow:visible}main .pane.hide{display:flex!important}main.fit .pane .splist{overflow:visible}}
/* profile pages: menu rows that open a page, with a back arrow */
.pfhead{display:flex;align-items:center;gap:10px}
.pfpage{display:flex;flex-direction:column;gap:12px}
.navrow{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;min-height:56px;color:var(--ink)}
.navrow+.navrow{border-top:1px solid var(--line)}
.navrow b{display:block;font-size:15px}
.navrow small{display:block;font-size:13px;color:var(--muted);margin-top:1px}
.navrow svg{flex:none;color:var(--muted)}
.navrow:focus-visible{outline:3px solid var(--forest);outline-offset:-3px}
.profile input{min-height:38px;padding:4px 10px;font-size:16px;border-width:1.5px}
.profile label.f{font-size:12px;gap:2px}
/* short phones: drop the extras so Home and Walk still fit */
@media (max-height:740px){.hero .trace,.tip{display:none}.hero{padding-bottom:12px}}
/* auto-fit: app.js adds t1, t2, t3 to Home or Walk, one at a time, until nothing scrolls */
main.fit.t1 .hero .trace,main.fit.t1 .tip,main.fit.t1 #meter{display:none}
main.fit.t1 .hero{padding-bottom:12px}
main.fit.t2{gap:8px;padding-top:4px}
main.fit.t2 .hero .hi,main.fit.t2 .hero .sum{display:none}
main.fit.t2 .micbtn{width:76px;height:76px;box-shadow:0 0 0 7px var(--ring)}
main.fit.t2 .micbtn svg{width:40px;height:40px}
main.fit.t2 .mic{gap:8px}
main.fit.t2 input{min-height:36px}
main.fit.t2 .banner{font-size:13px;padding:8px 12px}
main.fit.t2 .rbtn{width:50px;height:50px}main.fit.t2 .rbtn.stop{width:66px;height:66px}
main.fit.t3 .hero,main.fit.t3 #a11yOn{display:none}
main.fit.t3 label.f{font-size:12px}
body.big main.fit.t3{font-size:15px}body.big main.fit.t3 .miclbl,body.big main.fit.t3 .rb{font-size:14px}
/* no pull-to-refresh while a walk is running */
html.walking,html.walking body{overscroll-behavior-y:contain}
.sr{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.toggle{display:flex;gap:12px;align-items:flex-start;font-size:16px;font-weight:700;cursor:pointer}
.toggle input{width:26px;height:26px;min-height:0;flex:none;accent-color:var(--forest);margin:0}
.toggle small{display:block;font-weight:400;font-size:15px;color:var(--muted)}
h1:focus,h1:focus-visible{outline:none}
/* larger text */
body.big{font-size:19px}
body.big h1{font-size:32px}
body.big .hero h1{font-size:36px}
body.big h2{font-size:22px}
body.big .muted,body.big .card,body.big .route b,body.big .sp .nm b,body.big .heard p,body.big .tip{font-size:19px}
body.big .btn{min-height:64px;font-size:20px}
body.big .btn.small{min-height:58px;font-size:18px}
body.big .chip,body.big .pill,body.big .tag,body.big .sp .rt,body.big .stat span,body.big .navb,body.big .nums span{font-size:16px}
body.big .nums b{font-size:clamp(24px,7.4vw,30px)}
body.big input{font-size:20px;min-height:60px}
/* high contrast */
body.hc,body.hc[data-theme]{--paper:#fff;--sheet:#fff;--ink:#000;--muted:#1E1E1E;--forest:#0A3A26;--forest2:#002116;--onpri:#fff;--mist:#D4E6DA;--line:#000;--hero:#0A3A26;--heroInk:#fff;--heroMuted:#fff;--panel:#002116;--panelInk:#fff;--panelMuted:#fff;--trace:#fff;--ph:#333;--wordInk:#0A3A26;--turmeric:#F2B705;--accInk:#000;--stop:#A50E0E;--stopInk:#fff}
body.hc .group,body.hc .card,body.hc .route,body.hc .stat,body.hc .splist,body.hc .list,body.hc .chip,body.hc .qr,body.hc input{border:2px solid #000}
body.hc .btn.alt{border-width:3px}
@media print{nav,header,.noprint{display:none!important}body{background:#fff}.qrs{grid-template-columns:repeat(2,1fr)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand"><b lang="te">బర్డ్ వాక్</b><span>TNS bird walk</span></div>
    <div class="hdr-icons">
      <span id="modelBadge" class="sr"></span>
      <button class="iconbtn" id="qrBtn" aria-label="Show the QR code to share the app" aria-haspopup="dialog"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><path d="M14 14h3v3h-3zM18 18h3v3h-3zM6 6h1M17 6h1M6 17h1"/></svg></button>
      <button class="iconbtn" id="profileBtn" aria-label="Profile, settings and credits"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg></button>
    </div>
  </header>
  <main id="view"></main>
  <div id="sr" class="sr" role="status" aria-live="polite"></div>
  <div id="srA" class="sr" role="alert"></div>
</div>
<nav aria-label="Main">
  <div class="in">
    <button class="navb" data-go="home"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>Home</button>
    <button class="navb" data-go="walk"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19c3-6 5-2 8-8s5-4 8-6"/><circle cx="4" cy="19" r="1.6"/><circle cx="20" cy="5" r="1.6"/></svg>Walk</button>
  </div>
</nav>
<dialog id="qrDlg" aria-labelledby="qrTitle">
  <div class="qrbox">
    <h2 id="qrTitle">Scan to open TNS Bird Walk</h2>
    <div class="seg" role="group" aria-label="Which QR code"><button data-q="app" aria-pressed="true">The app</button><button data-q="access" aria-pressed="false">Spoken mode</button></div>
    <div id="qrBig"></div>
    <p class="muted" id="qrNote"></p>
    <button class="btn small" id="qrClose">Close</button>
  </div>
</dialog>
<script src="config.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script src="app.js"></script>
</body>
</html>
